# Example: run accessibility analysis on PR changeset only.
# Add OPENAI_API_KEY or ANTHROPIC_API_KEY as a repo secret.
name: Accessibility (PR changeset)
on:
  pull_request:
    types: [opened, synchronize]
jobs:
  accessibility:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # required for post-pr-comment
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run build
      - run: test -f dist/index.js || (echo "::error::dist/index.js missing after build" && exit 1)
      - name: Smyth Accessibility
        uses: ./
        with:
          scope: pr
          provider: openai
          model: gpt-4o
          acceptability-level: wcag-aa
          fail-on: warn
          post-pr-comment: "true"
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
