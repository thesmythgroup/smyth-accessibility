<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Semantic section example</title>
  </head>
  <body>
    <header>
      <nav aria-label="Main">
        <a href="/">Home</a>
      </nav>
    </header>
    <main>
      <h1>Page title</h1>
      <section aria-labelledby="section-heading">
        <h2 id="section-heading">Section</h2>
        <p>Content with sufficient contrast.</p>
        <button type="button">Accessible button</button>
      </section>
    </main>
    <footer>
      <p>&copy; Example</p>
    </footer>
  </body>
</html>
