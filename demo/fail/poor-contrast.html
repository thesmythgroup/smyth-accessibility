<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Poor contrast example</title>
    <style>
      /* Low-contrast text: light gray on white fails WCAG AA. */
      .low-contrast {
        color: #ccc;
        background: #fff;
      }
    </style>
  </head>
  <body>
    <h1>Poor contrast</h1>
    <p class="low-contrast">
      This text has insufficient contrast against the background.
    </p>
  </body>
</html>
