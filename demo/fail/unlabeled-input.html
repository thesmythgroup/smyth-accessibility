<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Unlabeled input example</title>
  </head>
  <body>
    <h1>Form without labels</h1>
    <form>
      <input type="text" placeholder="Name" />
      <input type="email" placeholder="Email" />
      <button type="submit">Submit</button>
    </form>
    <p>Inputs have no associated label or aria-label; expect findings.</p>
  </body>
</html>
